app:
  name: "Enterprise Procurement LLMOps Prototype"
  version: "1.0.0"
  environment: "development"

server:
  host: "0.0.0.0"
  port: 8000
  timeout_seconds: 30

llm:
  provider: "openai"
  default_model: "gpt-4o-mini"
  default_embedding_model: "text-embedding-3-small"
  temperature: 0.0
  max_tokens: 1000

rag:
  chunk_size: 500
  chunk_overlap: 50
  top_k: 3

guardrails:
  po_approval_threshold_usd: 5000.0
  allowed_roles_above_threshold: ["manager", "admin"]
  enable_strict_output_schema: true

database:
  db_path: "data/processed/procurement.db"

vector_store:
  index_path: "data/vector_store/index.faiss"
  metadata_path: "data/vector_store/metadata.json"
